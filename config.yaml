# llm-eval-error-bars configuration.
# Model names are NOT hard-coded from memory: the pilot stage lists the
# models currently available on Together AI and fills in candidates below.

benchmark:
  dataset: openai/gsm8k
  config: main
  split: test            # 1,319 questions
  pool_size: 400         # reference pool for the main run
  pool_seed: 20261112    # fixed seed for sampling the pool from the test split

sampling:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 512
  prompt_file: prompts/gsm8k_prompt.txt

pilot:
  n_questions: 40
  seeds: [0, 1]
  question_seed: 20261112
  # candidate_models: chosen at Stage 1 by probing the live Together
  # catalog (270 models listed 2026-11-12). Most listed models now answer
  # chat calls with "Unable to access non-serverless model" on this
  # account (legacy catalog moved to dedicated endpoints). These four
  # answered live serverless calls on 2026-11-12:
  candidate_models:
    - together/Tev1-4B-experimental
    - Qwen/Qwen3.5-9B
    - deepseek-ai/DeepSeek-V4.1-Flash
    - MiniMaxAI/MiniMax-M3.1-Flash

main:
  seeds: [0, 1, 2, 3, 4]   # 400 x 5 x 3 models = 6,000 calls
  # models: chosen by Omid at revised Checkpoint 1 (2026-11-12, after the
  # probe + pilot 2 in results/pilot2_summary.md) and approved by him;
  # frozen in PLAN.md at Stage 2. Pilot candidate lists above are history
  # and are unchanged.
  models:
    - arize-ai/qwen-2-1.5b-instruct
    - thinkingmachines/Inkling
    - meta-models/Muse-Glimmer-30B
  cost_stop_usd: 10.0      # stop and report if the pilot projection exceeds this

analysis:
  designs_N: [25, 50, 100, 200]
  designs_K: [1, 2, 3, 5]
  paired_designs_K: [1, 5]
  subsamples: 2000
  bootstrap_draws: 2000
  bayes_subsamples: 200    # Bayesian method is slow; run on a subset, stated openly
  level: 0.95
  budget_total_calls: 250
  budget_splits: [[250, 1], [125, 2], [83, 3], [50, 5]]
